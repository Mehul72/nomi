name: Nomi
options:
  bundleIdPrefix: com.mehulfursule
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  defaultConfig: Debug

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.4

settings:
  base:
    DEVELOPMENT_TEAM: MACDPWQG37
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Nomi:
    type: application
    platform: macOS
    sources:
      - path: Nomi
        excludes:
          - "Info.plist"
    entitlements:
      path: Nomi/Nomi.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
    info:
      path: Nomi/Info.plist
      properties:
        CFBundleName: Nomi
        CFBundleDisplayName: Nomi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: Nomi listens only while you hold the microphone button, so you can ask questions by voice.
        NSSpeechRecognitionUsageDescription: Nomi turns your voice into text on this Mac when on-device recognition is available.
        NSCalendarsFullAccessUsageDescription: Nomi reads and creates calendar events only when you ask it to.
        NSRemindersFullAccessUsageDescription: Nomi creates reminders only when you ask it to.
        NSLocationWhenInUseUsageDescription: Nomi uses your location only to answer weather questions when no home location is set.
        CFBundleURLTypes:
          - CFBundleURLName: com.mehulfursule.nomi
            CFBundleURLSchemes: [nomi]
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehulfursule.nomi
        PRODUCT_NAME: Nomi
        CODE_SIGN_ENTITLEMENTS: Nomi/Nomi.entitlements
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - NomiTests
      gatherCoverageData: false

  NomiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NomiTests
    dependencies:
      - target: Nomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehulfursule.nomi.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
